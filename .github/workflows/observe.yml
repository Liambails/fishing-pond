name: COBALT observations
on:
  # Scheduling is owned by AWS EventBridge Scheduler. AWS invokes the Lambda bridge,
  # which dispatches this workflow. Keep GitHub as compute/source control, not the clock.
  workflow_dispatch:
concurrency:
  group: cobalt-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: worker
    env:
      MAX_LISTINGS_PER_RUN: '24'
      SEARCH_WATCH_MAX_LISTING_PRICE_NZD: '5000'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COBALT_WEB_URL: 'https://fishing-pond-seven.vercel.app'
      COBALT_INGEST_TOKEN: ${{ secrets.COBALT_INGEST_TOKEN }}
      FISHING_POND_INGEST_TOKEN: ${{ secrets.FISHING_POND_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ignore duplicate scheduler dispatches
        id: dispatch_guard
        run: python dispatch_guard.py

      # Standard-library-only heartbeat: runs before pip so bootstrap failures are visible.
      - name: Record scheduler wake
        if: steps.dispatch_guard.outputs.duplicate != 'true'
        continue-on-error: true
        run: python scheduler_telemetry.py start

      - name: Install and verify Python dependencies
        if: steps.dispatch_guard.outputs.duplicate != 'true'
        id: deps
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee -a scheduler_debug.log
          success=false
          for attempt in 1 2 3; do
            echo "Dependency attempt $attempt/3" | tee -a scheduler_debug.log
            if pip install -r requirements.txt 2>&1 | tee -a scheduler_debug.log; then
              success=true
              echo "DEPENDENCY_ATTEMPTS=$attempt" >> "$GITHUB_ENV"
              break
            fi
            if [ "$attempt" != "3" ]; then
              delay=$((attempt * 10))
              echo "Dependency install failed; retrying in ${delay}s" | tee -a scheduler_debug.log
              sleep "$delay"
            fi
          done
          if [ "$success" != "true" ]; then
            python scheduler_telemetry.py bootstrap_failed "pip install failed after 3 attempts" || true
            exit 1
          fi
          if ! python -c "import playwright, supabase, dotenv; print('Python dependencies verified')" 2>&1 | tee -a scheduler_debug.log; then
            python scheduler_telemetry.py bootstrap_failed "dependency import verification failed" || true
            exit 1
          fi
          python scheduler_telemetry.py dependencies_ok || true

      - name: Check whether Search Watches are due
        if: steps.dispatch_guard.outputs.duplicate != 'true'
        id: search_due
        shell: bash
        run: |
          set +e
          python search_watches.py --due-check 2>&1 | tee -a scheduler_debug.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "0" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "3" ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "Search Watch due-check failed." | tee -a scheduler_debug.log
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether anything is due
        if: steps.dispatch_guard.outputs.duplicate != 'true'
        id: due
        shell: bash
        run: |
          set -o pipefail
          success=false
          for attempt in 1 2 3 4; do
            echo "Preflight attempt $attempt/4" | tee -a scheduler_debug.log
            if python due_check.py 2>&1 | tee -a scheduler_debug.log; then
              success=true
              echo "PREFLIGHT_ATTEMPTS=$attempt" >> "$GITHUB_ENV"
              break
            fi
            if [ "$attempt" != "4" ]; then
              delay=$((attempt * 15))
              echo "Due preflight failed; retrying in ${delay}s" | tee -a scheduler_debug.log
              sleep "$delay"
            fi
          done
          if [ "$success" != "true" ]; then
            python scheduler_telemetry.py preflight_failed "due_check.py failed after 4 attempts" || true
            exit 1
          fi

      - name: Cache Playwright Chromium
        if: steps.dispatch_guard.outputs.duplicate != 'true' && (steps.due.outputs.due == 'true' || steps.search_due.outputs.due == 'true')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('worker/requirements.txt') }}

      - name: Install Chromium system dependencies
        if: steps.dispatch_guard.outputs.duplicate != 'true' && (steps.due.outputs.due == 'true' || steps.search_due.outputs.due == 'true')
        shell: bash
        run: |
          set -o pipefail

          # GitHub's Ubuntu image may carry Google's Chrome APT source. COBALT uses
          # Playwright Chromium, so that repository is unnecessary and a transient
          # Google Packages hash mismatch must not prevent an observation cycle.
          if [ -d /etc/apt/sources.list.d ]; then
            while IFS= read -r source_file; do
              echo "Temporarily disabling Chrome APT source: $source_file" | tee -a scheduler_debug.log
              sudo sed -i 's|^[[:space:]]*deb |# deb |' "$source_file"
            done < <(grep -rl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          fi

          success=false
          for attempt in 1 2 3; do
            echo "Chromium dependency attempt $attempt/3" | tee -a scheduler_debug.log
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get clean

            if python -m playwright install-deps chromium 2>&1 | tee -a scheduler_debug.log; then
              success=true
              break
            fi

            if [ "$attempt" != "3" ]; then
              delay=$((attempt * 10))
              echo "Chromium dependency install failed; retrying in ${delay}s" | tee -a scheduler_debug.log
              sleep "$delay"
            fi
          done

          if [ "$success" != "true" ]; then
            python scheduler_telemetry.py chromium_failed "playwright chromium dependency install failed after 3 attempts" || true
            exit 1
          fi

      - name: Install Chromium browser
        if: steps.dispatch_guard.outputs.duplicate != 'true' && (steps.due.outputs.due == 'true' || steps.search_due.outputs.due == 'true')
        shell: bash
        run: |
          set -o pipefail
          success=false

          for attempt in 1 2 3; do
            echo "Chromium browser attempt $attempt/3" | tee -a scheduler_debug.log
            if python -m playwright install chromium 2>&1 | tee -a scheduler_debug.log; then
              success=true
              break
            fi

            if [ "$attempt" != "3" ]; then
              delay=$((attempt * 10))
              echo "Chromium browser install failed; retrying in ${delay}s" | tee -a scheduler_debug.log
              sleep "$delay"
            fi
          done

          if [ "$success" != "true" ]; then
            python scheduler_telemetry.py chromium_failed "playwright chromium browser install failed after 3 attempts" || true
            exit 1
          fi

      - name: Run due Search Watches
        if: steps.dispatch_guard.outputs.duplicate != 'true' && steps.search_due.outputs.due == 'true'
        shell: bash
        env:
          HEADLESS: 'true'
        run: |
          set -o pipefail
          if ! python search_watches.py 2>&1 | tee -a scheduler_debug.log; then
            echo "Search Watch runner failed; ordinary listing observations will continue." | tee -a scheduler_debug.log
          fi

      - name: Collect due listings
        if: steps.dispatch_guard.outputs.duplicate != 'true' && steps.due.outputs.due == 'true'
        shell: bash
        env:
          HEADLESS: 'true'
        run: |
          set -o pipefail
          if ! python run.py 2>&1 | tee -a scheduler_debug.log; then
            python scheduler_telemetry.py worker_failed "run.py returned non-zero" || true
            exit 1
          fi

      - name: Scan cross-listing opportunity signals
        # Opportunity evaluation is intentionally decoupled from Playwright collection.
        # A scheduler wake-up can materialise a lead from evidence already stored in the DB,
        # even when no listing happens to be due in this exact 10-minute window.
        if: steps.dispatch_guard.outputs.duplicate != 'true'
        shell: bash
        run: |
          set -o pipefail
          SCAN_TOKEN="${COBALT_INGEST_TOKEN:-${FISHING_POND_INGEST_TOKEN:-}}"
          if [ -z "$SCAN_TOKEN" ]; then
            echo "WARNING: Opportunity scan skipped because neither COBALT_INGEST_TOKEN nor legacy FISHING_POND_INGEST_TOKEN is configured in GitHub Actions." | tee -a scheduler_debug.log
            echo "Ordinary observations/Search Watches are unaffected; add a matching GitHub Actions secret to enable Opportunity scans." | tee -a scheduler_debug.log
            python scheduler_telemetry.py opportunity_scan_skipped "GitHub ingest token missing" || true
            exit 0
          fi
          response_file="$(mktemp)"
          scan_ok=false
          for attempt in 1 2 3; do
            echo "Opportunity scan attempt $attempt/3" | tee -a scheduler_debug.log
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 15 \
              --max-time 120 \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 5 \
              -X POST "$COBALT_WEB_URL/api/opportunities/scan" \
              -H "x-cobalt-token: $SCAN_TOKEN" \
              -H "content-type: application/json" \
              -d '{}' \
              -o "$response_file"; then
              scan_ok=true
              break
            fi
            if [ "$attempt" != "3" ]; then sleep $((attempt * 10)); fi
          done
          if [ "$scan_ok" = "true" ]; then
            echo "Opportunity scan response:" | tee -a scheduler_debug.log
            cat "$response_file" | tee -a scheduler_debug.log
            echo | tee -a scheduler_debug.log
          else
            echo "WARNING: Opportunity scan failed after retries. Observation collection already completed, so this scheduler run will remain healthy and the next wake can retry the scan." | tee -a scheduler_debug.log
            cat "$response_file" | tee -a scheduler_debug.log || true
            echo | tee -a scheduler_debug.log
            python scheduler_telemetry.py opportunity_scan_failed "$(cat "$response_file" 2>/dev/null | head -c 1000)" || true
          fi
          rm -f "$response_file"

      - name: Write GitHub step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## COBALT scheduler diagnostics"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- COBALT: $(python -c 'import json,pathlib; print(json.loads((pathlib.Path.cwd().parent/"web"/"package.json").read_text()).get("version","unknown"))')"
            echo "- Due output: ${{ steps.due.outputs.due }}"
            echo "- Due count: ${{ steps.due.outputs.due_count }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scheduler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-scheduler-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            worker/scheduler_debug.log
            worker/scheduler_debug.jsonl
          if-no-files-found: ignore
          retention-days: 14
