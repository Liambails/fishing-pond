name: COBALT observations
on:
  workflow_dispatch:
  schedule:
    # Six scheduler wake-ups per hour. The due queue decides whether any browser collection is needed.
    - cron: '7,17,27,37,47,57 * * * *'
      timezone: 'Pacific/Auckland'
concurrency:
  group: cobalt-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            pip install -r requirements.txt && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Dependency install failed (attempt $attempt/3); retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          python -c "import playwright, supabase, dotenv; print('Python dependencies ready')"
      - name: Check whether anything is due
        id: due
        run: |
          for attempt in 1 2 3 4; do
            python due_check.py && exit 0
            if [ "$attempt" = "4" ]; then exit 1; fi
            echo "Due preflight failed (attempt $attempt/4); retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Install Chromium
        if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m playwright install --with-deps chromium
      - name: Collect due listings
        if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: python run.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_LISTINGS_PER_RUN: '12'
          HEADLESS: 'true'
